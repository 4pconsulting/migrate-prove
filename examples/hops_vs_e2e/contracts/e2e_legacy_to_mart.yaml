version: 1
name: e2e-legacy-to-mart

entities:
  - name: customers
    source_table: legacy_customer
    target_table: mart_customer
    business_key: [customer_id]
    risk: critical
    mappings:
      - source: CustID
        target: customer_id
        kind: direct
        normalize: { trim: true, upper: true }
      - source: Name
        target: customer_name
        kind: direct
        normalize: { trim: true }
      - source: Status
        target: status
        kind: transform
        lookup:
          A: Active
          S: Suspended
          C: Closed
        normalize: { trim: true }
      - source: Balance
        target: current_balance
        kind: coerce
        normalize: { decimal_places: 2 }
