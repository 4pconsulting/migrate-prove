version: 1
name: e2e-legacy-to-mart

entities:
  - name: customers
    source_table: legacy_customer
    target_table: mart_customer
    business_key: [customer_id]
    risk: critical
    volume_slices:
      - [status]
    mappings:
      - source: CustID
        target: customer_id
        kind: direct
        normalize: { trim: true, upper: true }
      - source: Name
        target: customer_name
        kind: direct
        normalize: { trim: true }
      - source: Status
        target: status
        kind: transform
        lookup:
          A: Active
          S: Suspended
          C: Closed
        normalize: { trim: true }
      - source: Balance
        target: current_balance
        kind: coerce
        normalize: { decimal_places: 2 }
    metrics:
      - name: account_count
        source_sql: COUNT(*)
        target_sql: COUNT(*)
      - name: total_balance
        source_sql: SUM(Balance)
        target_sql: SUM(current_balance)
        tolerance_abs: 0.01
    sample:
      strategy: full
