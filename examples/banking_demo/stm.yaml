version: 1
name: banking-core-migration

entities:
  - name: customers
    source_table: Customer
    target_table: customers
    business_key: [customer_id]
    risk: critical
    mappings:
      - source: CustID
        target: customer_id
        kind: direct
        nullable: false
        normalize: { trim: true, upper: true }
      - source: Name
        target: customer_name
        kind: direct
        max_length: 40
        normalize: { trim: true }
      - source: Status
        target: status
        kind: transform
        lookup:
          A: Active
          S: Suspended
          C: Closed
        normalize: { trim: true, upper: false }
      - source: DateOfBirth
        target: date_of_birth
        kind: direct
        normalize: { trim: true }
      - source: Balance
        target: current_balance
        kind: coerce
        normalize: { decimal_places: 4 }
      - source: CreatedAt
        target: created_at
        kind: direct
      - source: UpdatedAt
        target: updated_at
        kind: direct
      - source: Postcode
        target: postcode
        kind: direct
        normalize: { trim: true }
      - source: CreditScore
        target: risk_tier
        kind: transform
        rules:
          - when: "credit_score >= 750 and default_history == 0"
            then: "LOW"
          - when: "credit_score >= 600"
            then: "MEDIUM"
          - else: "HIGH"

  - name: order_items
    source_table: OrderItem
    target_table: order_items
    business_key: [item_id]
    source_key: [ItemID]
    risk: master
    mappings:
      - source: ItemID
        target: item_id
        kind: direct
      - source: OrderID
        target: order_id
        kind: direct
      - source: Amount
        target: amount
        kind: direct
        normalize: { decimal_places: 2 }
