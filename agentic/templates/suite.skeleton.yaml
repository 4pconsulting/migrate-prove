# Suite — fill via Suite agent + elicit-connections. Secrets only as ${ENV}.
# STM = mapping oracle; this file owns connections + prove checks.
name: REPLACE_suite_name
contract: stm.yaml
# params:
#   load_date: "2026-10-01"
source:
  # Option A: URL
  url: ${SOURCE_URL}
  # Option B: structured (omit url)
  # dialect: postgresql+psycopg
  # host: ${SOURCE_HOST}
  # port: 5432
  # database: ${SOURCE_DB}
  # username: ${SOURCE_USER}
  # password: ${SOURCE_PASSWORD}
  # Option C: Salesforce mock fixtures
  # kind: salesforce_mock
  # fixtures: fixtures/salesforce
  # Option D: live Salesforce (requires migrate-prove[salesforce])
  # kind: salesforce
  # url: ${SALESFORCE_URL}
  # api_version: ${SALESFORCE_API_VERSION}
  # client_id: ${SALESFORCE_CLIENT_ID}
  # client_secret: ${SALESFORCE_CLIENT_SECRET}
  # Option E: declarative HTTP API (requires migrate-prove[http])
  # kind: http
  # base_url: ${API_BASE_URL}
  # auth: { type: bearer, token: ${API_TOKEN} }
  # resources:
  #   Account:
  #     list_path: /v1/accounts
  #     records_jmespath: data
  #     next_jmespath: next
target:
  url: ${TARGET_URL}
# Omit source or target for one-sided prove (emit PASS + evidence).
output_dir: artifacts
continue_on_fail: true
# row_smoke: { n: 5 }   # or false to disable (also skipped with --no-schema-check)
checks:
  - id: REPLACE_entity.count
    kind: count
    entity: REPLACE_entity
